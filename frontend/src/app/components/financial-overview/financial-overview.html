<section class="overview-hero" aria-label="Estado financiero general">

  <!-- Balance actual -->
  <div class="overview-main">
    <p class="overview-label">Balance actual</p>
    <p class="overview-balance" [class.negative]="+currentBalance < 0">{{ currentBalance | money }}</p>
    <p class="overview-caption">Ingresos − Gastos − Aportes a metas</p>
  </div>

  <!-- Divisor -->
  <div class="overview-divider" aria-hidden="true"></div>

  <!-- Total ahorrado -->
  <div class="overview-savings">
    <div class="savings-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/><path d="M18 2v4h4"/></svg>
    </div>
    <div>
      <p class="savings-label">Total ahorrado en metas</p>
      <p class="savings-value">{{ totalSavings | money }}</p>
    </div>
  </div>

</section>
