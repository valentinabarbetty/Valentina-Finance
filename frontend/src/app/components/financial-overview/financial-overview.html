<section class="overview-card" aria-label="Estado financiero general">
  <p class="overview-label">Balance acumulado</p>
  <p class="overview-balance" [class.negative]="+stats.netBalance < 0">{{ stats.netBalance | money }}</p>
  <p class="overview-caption">Lo registrado históricamente en Valen Finance</p>

  <div class="overview-grid">
    <div class="overview-item">
      <span class="overview-item-label">Total ingresado</span>
      <span class="overview-item-value income">{{ stats.totalIncome | money }}</span>
    </div>
    <div class="overview-item">
      <span class="overview-item-label">Total gastado</span>
      <span class="overview-item-value expense">{{ stats.totalExpense | money }}</span>
    </div>
    <div class="overview-item">
      <span class="overview-item-label">Aportado a metas</span>
      <span class="overview-item-value">{{ stats.totalContributedToGoals | money }}</span>
    </div>
  </div>
</section>
