@if (confirmService.state(); as ctx) {
  <!-- Backdrop -->
  <div
    class="confirm-backdrop"
    (click)="confirmService.cancel()"
    aria-hidden="true">
  </div>

  <!-- Dialog -->
  <div
    class="confirm-dialog"
    role="alertdialog"
    aria-modal="true"
    [attr.aria-labelledby]="'confirm-title'"
    [attr.aria-describedby]="ctx.message ? 'confirm-message' : null">

    <!-- Icon -->
    <div class="confirm-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
           stroke="currentColor" stroke-width="1.8">
        <path d="M3 6h18"/>
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        <path d="M10 11v6M14 11v6"/>
      </svg>
    </div>

    <!-- Content -->
    <div class="confirm-content">
      <h2 id="confirm-title" class="confirm-title">{{ ctx.title }}</h2>
      @if (ctx.message) {
        <p id="confirm-message" class="confirm-message">{{ ctx.message }}</p>
      }
    </div>

    <!-- Actions -->
    <div class="confirm-actions">
      <button
        class="confirm-btn confirm-btn-cancel"
        type="button"
        data-action="cancel"
        (click)="confirmService.cancel()">
        {{ ctx.cancelLabel ?? 'Cancelar' }}
      </button>
      <button
        class="confirm-btn confirm-btn-danger"
        type="button"
        (click)="confirmService.confirm()">
        {{ ctx.confirmLabel ?? 'Eliminar' }}
      </button>
    </div>

  </div>
}
